<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <title>{{ .Site.Title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ if eq .Site.Params.color_theme "dark" }}
    <style>
      body { background: #1f1b29; color: #f4f4f4; font-family: sans-serif; padding: 5% 10%; line-height: 1.6; }
      a { color: #ff79c6; text-decoration: none; margin-right: 15px; }
      a:hover { text-decoration: underline; }
      nav { margin-bottom: 30px; border-bottom: 1px solid #3a304c; padding-bottom: 10px; }
      nav a.active { font-weight: bold; text-decoration: underline; }
      h1, h2, h3 { color: #ffffff; }
    </style>
  {{ else }}
    <style>
      body { background: #fff; color: #333; font-family: sans-serif; padding: 5% 10%; line-height: 1.6; }
      a { color: #0066cc; text-decoration: none; margin-right: 15px; }
      nav { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    </style>
  {{ end }}

  <style>
    .site-header {
      text-align: center;
      padding: 20px 0 25px 0;
      margin-bottom: 10px;
    }
    .site-title {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      color: #ff79c6;
      text-decoration: none;
    }
    .site-title a { color: #ff79c6; }
    .site-title a:hover { text-decoration: none; }
    @media (max-width: 600px) {
      .site-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <!-- Название станции: над меню, по центру, крупным шрифтом -->
  <header class="site-header">
    <h1 class="site-title"><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
  </header>

  <!-- Вывод меню навигации -->
  {{ partial "nav.html" . }}

  {{ block "main" . }}{{ end }}
</body>
</html>
